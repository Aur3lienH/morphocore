[build-system]
requires = ["setuptools>=61.0.0", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morphocore"
dynamic = ["version", "dependencies"]
description = "Morphological operations with CUDA acceleration"
readme = "README.md"
authors = [{name = "Aurelien HURAND", email = "aurelien.hurand@gmail.com"}]
license = {text = "MIT"} 
requires-python = ">=3.11"
keywords = ["morphology", "cuda", "pytorch", "computer-vision"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
"Homepage" = "https://gitlab.lre.epita.fr/aurelien.hurand/morphocore"
"Bug Reports" = "https://gitlab.lre.epita.fr/aurelien.hurand/morphocore/-/issues"
"Source" = "https://gitlab.lre.epita.fr/aurelien.hurand/morphocore"

[tool.setuptools.packages.find]
exclude = [
    "morphocore.functional.csrc",
    "morphocore.functional.csrc.*",
    "morphocore.functional.csrc.cpp", 
    "morphocore.functional.csrc.cuda"
]
