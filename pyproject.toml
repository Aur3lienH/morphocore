[build-system]
requires = ["setuptools>=61.0.0", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "morphocore"
version = "0.0.1"
description = "Morphological operations with CUDA acceleration"
readme = "README.md"
authors = [{name = "Aurelien HURAND", email = "aurelien.hurand@gmail.com"}]
license = {text = "MIT"} 
requires-python = ">=3.8"

keywords = ["morphology", "cuda", "pytorch", "computer-vision"]

dependencies = [
    "torch>=1.12.0",
    "numpy>=1.19.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
"Homepage" = "https://gitlab.lre.epita.fr/aurelien.hurand/morphocore"
"Bug Reports" = "https://gitlab.lre.epita.fr/aurelien.hurand/morphocore/-/issues"
"Source" = "https://gitlab.lre.epita.fr/aurelien.hurand/morphocore"

[tool.setuptools.packages.find]
exclude = [
    "morphocore.functional.csrc",
    "morphocore.functional.csrc.*",
    "morphocore.functional.csrc.cpp", 
    "morphocore.functional.csrc.cuda"
]
# Configuration cibuildwheel (reste identique)
[tool.cibuildwheel]
build-verbosity = 3
build = "cp38-* cp39-* cp310-* cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686"
environment = { MORPHO_WITH_CUDA="0"}

[tool.cibuildwheel.linux]
before-all = [
    "pip install torch --index-url https://download.pytorch.org/whl/cpu",
    # "pip install setuptools",
    # "yum install -y gcc gcc-c++",
    # "yum install -y epel-release",
    # "yum install -y wget",
]

repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude libtorch_cpu.so --exclude libc10.so --exclude libtorch.so --exclude libtorch_python.so --exclude libtorch_cuda.so"



