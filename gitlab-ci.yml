stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

test:
  stage: test
  image: python:3.11
  services:
    - docker:dind
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install pytest torch numpy
    - pip install -e . --no-isolation  
  script:
    - pytest tests/ -v
    - python -c "import morphocore; print('Import successful')"  
  coverage: '/TOTAL.*\s+(\d+%)$/'  
  artifacts:
    reports:
      junit: junit.xml  
    paths:
      - htmlcov/  # If you generate coverage reports
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH  

build-wheels:
  stage: build
  image: python:3.11
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - pip install build
    - docker info  
  script:
    - python -m build --wheel --no-isolation --outdir wheelhouse/
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG  
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  

deploy-pypi:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install twine
  script:
    - twine upload wheelhouse/* --username __token__ --password $PYPI_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build-wheels