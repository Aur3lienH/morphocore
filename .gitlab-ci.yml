stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

test:
  stage: test
  # CPU only tests: a plain Python image is enough, and its Python must be a supported one.
  image: python:3.11
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip setuptools wheel
    # Pinned to the newest torch of the release matrix, so the tests do not depend on the latest
    # release building with this image's GCC. The CPU wheels skip the CUDA libraries.
    - pip install "torch==2.9.*" --index-url https://download.pytorch.org/whl/cpu
    - pip install pytest numpy pytest-benchmark
    # Build against the torch installed above instead of the latest one an isolated build pulls.
    - MORPHO_WITH_CUDA=0 pip install -e . --no-build-isolation
  script:
    - pytest tests/ -v -k "cpu" --junitxml=junit.xml  
    - python -c "import morphocore; print('Import successful')"  
  coverage: '/TOTAL.*\s+(\d+%)$/'  
  artifacts:
    reports:
      junit: junit.xml  
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image: python:3.11
  # One job builds every Python version of one torch version, which takes about an hour.
  timeout: 2h
  # The global cache (the test job's venv and pip cache) is never used here, and archiving it
  # alone can take minutes.
  cache: []
  services:
    - name: docker:dind
      command: ["--dns=8.8.8.8", "--dns=1.1.1.1"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      - TORCH_VERSION: ["2.6", "2.7", "2.8", "2.9"]
  before_script:
    - apt-get update && apt-get install -y docker.io
    - pip install --upgrade pip cibuildwheel
    - export TORCH_VERSION="${TORCH_VERSION}"
  script:
    - CIBW_ENVIRONMENT="TORCH_VERSION=${TORCH_VERSION}" cibuildwheel --output-dir wheelhouse --platform linux
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG  

# Uses an API token rather than PyPI trusted publishing. Trusted publishing needs PyPI to trust
# this instance's OIDC issuer (https://gitlab.lre.epita.fr), and self-managed GitLab instances are
# still a manually onboarded beta: it requires a PyPI Organization and a request to
# support+orgs@pypi.org. A publisher registered for gitlab.com does not apply here, the issuer
# differs. Revisit once the instance is onboarded.
deploy-pypi:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install twine
  script:
    - twine upload wheelhouse/* --username __token__ --password $PYPI_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build

pages:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r docs/requirements.txt
    - MORPHO_WITH_CUDA=0 pip install -e .
  script:
    - cd docs
    - make html
    - cd ..
    - mv docs/build/html public
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG

notify-release:
  stage: deploy
  image: curlimages/curl:latest
  needs:
    - job: deploy-pypi
      artifacts: false
  script:
    - |
      curl -X POST \
        -H "Content-Type: application/json" \
        -w "\nHTTP Status: %{http_code}\n" \
        -d "{
          \"attachments\": [{
            \"contentType\": \"application/vnd.microsoft.card.adaptive\",
            \"content\": {
              \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
              \"type\": \"AdaptiveCard\",
              \"version\": \"1.4\",
              \"body\": [
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"🎉 New Version of Morphocore Released!\",
                  \"weight\": \"bolder\",
                  \"size\": \"large\",
                  \"color\": \"good\"
                },
                {
                  \"type\": \"FactSet\",
                  \"facts\": [
                    {
                      \"title\": \"📦 Version:\",
                      \"value\": \"${CI_COMMIT_TAG}\"
                    }
                  ]
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"✨ What's New:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"${CI_COMMIT_MESSAGE}\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"🔗 Quick Links:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"• [📚 Documentation](https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}/)\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"• [🐍 PyPI Package](https://pypi.org/project/morphocore)\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"⚡ Update Now:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"CodeBlock\",
                  \"codeSnippet\": \"pip install --upgrade morphocore\",
                  \"language\": \"bash\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"💡 *Don't forget to update your environment!*\",
                  \"isSubtle\": true,
                  \"spacing\": \"small\"
                }
              ]
            }
          }]
        }" \
        "${TEAMS_WEBHOOK_URL}"
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true