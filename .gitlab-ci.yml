stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

test:
  stage: test
  image: python:3.11
  services:
    - docker:dind
  before_script:
    - apt-get update
    - apt-get install -y wget gnupg2
    - wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.0-1_all.deb
    - dpkg -i cuda-keyring_1.0-1_all.deb
    - apt-get update
    - apt-get install -y cuda-toolkit-12-2  # or desired version
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH

    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install pytest torch numpy pytest-benchmark
    - pip install -e .  
  script:
    - pytest tests/ -v -k "cpu" --junitxml=junit.xml  
    - python -c "import morphocore; print('Import successful')"  
  coverage: '/TOTAL.*\s+(\d+%)$/'  
  artifacts:
    reports:
      junit: junit.xml  
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

build-wheels:
  stage: build
  image: python:3.11
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apt-get update
    - apt-get install -y wget gnupg2
    - wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.0-1_all.deb
    - dpkg -i cuda-keyring_1.0-1_all.deb
    - apt-get update
    - apt-get install -y cuda-toolkit-12-2  # or desired version
    - export PATH=/usr/local/cuda/bin:$PATH
    - export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH

    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install build
  script:
    - python -m build --wheel --no-isolation --outdir wheelhouse/
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG  
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  

deploy-pypi:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install twine
  script:
    - twine upload wheelhouse/* --username __token__ --password $PYPI_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build-wheels