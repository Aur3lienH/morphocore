stages:
  - images
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Builder images of the Linux wheels, one per CUDA version, see ci/docker.
  BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/builder"

# Only pip's cache: the venv is rebuilt by every job anyway.
cache:
  paths:
    - .cache/pip

test:
  stage: test
  # CPU only tests: a plain Python image is enough, and its Python must be a supported one.
  image: python:3.11
  before_script:
    # --clear: caches made before .venv/ left the cache paths still restore a venv, whose
    # interpreter links do not match this image and make ensurepip fail.
    - python3 -m venv --clear .venv
    - source .venv/bin/activate
    - pip install --upgrade pip setuptools wheel
    # Pinned to the newest torch of the release matrix, so the tests do not depend on the latest
    # release building with this image's GCC. The CPU wheels skip the CUDA libraries.
    - pip install "torch==2.9.*" --index-url https://download.pytorch.org/whl/cpu
    - pip install pytest numpy pytest-benchmark
    # Build against the torch installed above instead of the latest one an isolated build pulls.
    - MORPHO_WITH_CUDA=0 pip install -e . --no-build-isolation
  script:
    - pytest tests/ -v -k "cpu" --junitxml=junit.xml  
    - python -c "import morphocore; print('Import successful')"  
  coverage: '/TOTAL.*\s+(\d+%)$/'  
  artifacts:
    reports:
      junit: junit.xml  
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

# Builds and pushes the builder images, only when their sources change (or from a manually run
# pipeline): the wheel jobs then run in them directly, and the runner keeps them between jobs. The
# first image (CUDA 12.3, gcc-toolset-12) builds up to torch 2.9. Newer headers need a newer GCC, and
# torch >= 2.11 uses CUDA 13, so the others are the plain manylinux image (gcc-toolset-14) with the
# CUDA of PyPI's torch installed.
builder-images:
  stage: images
  image: docker:27
  cache: []
  services:
    - name: docker:27-dind
      command: ["--dns=8.8.8.8", "--dns=1.1.1.1"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      - CUDA_VERSION: "12.3"
        DOCKERFILE: ci/docker/builder-cuda12.3.Dockerfile
      - CUDA_VERSION: ["12.8", "13.0"]
        DOCKERFILE: ci/docker/builder.Dockerfile
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # A tag only needs the image to exist: it is rebuilt by the branch pipeline of a change to it.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] && docker manifest inspect "$BUILDER_IMAGE:cuda$CUDA_VERSION" > /dev/null 2>&1; then
        echo "$BUILDER_IMAGE:cuda$CUDA_VERSION already exists"
        exit 0
      fi
    - docker build -f "$DOCKERFILE" --build-arg CUDA_VERSION="$CUDA_VERSION" -t "$BUILDER_IMAGE:cuda$CUDA_VERSION" ci
    - docker push "$BUILDER_IMAGE:cuda$CUDA_VERSION"
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - ci/docker/*
        - ci/install_cuda.sh
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG

# One job builds every Python version of one torch version, in the builder image of its CUDA.
build:
  stage: build
  image: $BUILDER_IMAGE:cuda$CUDA_VERSION
  timeout: 2h
  # The global cache (the test job's pip cache) is never used here.
  cache: []
  parallel:
    matrix:
      - TORCH_VERSION: ["2.6", "2.7", "2.8", "2.9"]
        CUDA_VERSION: "12.3"
      - TORCH_VERSION: "2.10"
        CUDA_VERSION: "12.8"
      - TORCH_VERSION: ["2.11", "2.12", "2.13", "2.14"]
        CUDA_VERSION: "13.0"
  script:
    - bash ci/build_linux_wheels.sh "${TORCH_VERSION}" wheelhouse
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG

# CPU-only Windows wheels, cross-compiled with clang-cl (see ci/build_windows_wheels.sh): PyPI's torch
# for Windows is CPU only too. No Windows runner is needed.
build-windows:
  stage: build
  image: python:3.12-trixie
  cache: []
  parallel:
    matrix:
      - TORCH_VERSION: ["2.6", "2.7", "2.8", "2.9", "2.10", "2.11", "2.12", "2.13", "2.14"]
  before_script:
    - apt-get update && apt-get install -y clang-19 lld-19 unzip
    - export PATH=/usr/lib/llvm-19/bin:$PATH
  script:
    - bash ci/build_windows_wheels.sh "${TORCH_VERSION}" wheelhouse
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG  

# Uses an API token rather than PyPI trusted publishing. Trusted publishing needs PyPI to trust
# this instance's OIDC issuer (https://gitlab.lre.epita.fr), and self-managed GitLab instances are
# still a manually onboarded beta: it requires a PyPI Organization and a request to
# support+orgs@pypi.org. A publisher registered for gitlab.com does not apply here, the issuer
# differs. Revisit once the instance is onboarded.
deploy-pypi:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install twine
  script:
    # --skip-existing: a re-run or a re-tag of an already published version uploads only the missing files.
    - twine upload --skip-existing wheelhouse/* --username __token__ --password $PYPI_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build
    - build-windows

pages:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r docs/requirements.txt
    - MORPHO_WITH_CUDA=0 pip install -e .
  script:
    - cd docs
    - make html
    - cd ..
    - mv docs/build/html public
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG

notify-release:
  stage: deploy
  image: curlimages/curl:latest
  needs:
    - job: deploy-pypi
      artifacts: false
  script:
    - |
      curl -X POST \
        -H "Content-Type: application/json" \
        -w "\nHTTP Status: %{http_code}\n" \
        -d "{
          \"attachments\": [{
            \"contentType\": \"application/vnd.microsoft.card.adaptive\",
            \"content\": {
              \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
              \"type\": \"AdaptiveCard\",
              \"version\": \"1.4\",
              \"body\": [
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"🎉 New Version of Morphocore Released!\",
                  \"weight\": \"bolder\",
                  \"size\": \"large\",
                  \"color\": \"good\"
                },
                {
                  \"type\": \"FactSet\",
                  \"facts\": [
                    {
                      \"title\": \"📦 Version:\",
                      \"value\": \"${CI_COMMIT_TAG}\"
                    }
                  ]
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"✨ What's New:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"${CI_COMMIT_MESSAGE}\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"🔗 Quick Links:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"• [📚 Documentation](https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}/)\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"• [🐍 PyPI Package](https://pypi.org/project/morphocore)\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"⚡ Update Now:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"CodeBlock\",
                  \"codeSnippet\": \"pip install --upgrade morphocore\",
                  \"language\": \"bash\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"💡 *Don't forget to update your environment!*\",
                  \"isSubtle\": true,
                  \"spacing\": \"small\"
                }
              ]
            }
          }]
        }" \
        "${TEAMS_WEBHOOK_URL}"
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true