stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

test:
  stage: test
  image: nvidia/cuda:11.8.0-devel-ubuntu22.04
  services:
    - docker:dind
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install pytest torch numpy pytest-benchmark
    - MORPHO_WITH_CUDA=0 pip install -e .  
  script:
    - pytest tests/ -v -k "cpu" --junitxml=junit.xml  
    - python -c "import morphocore; print('Import successful')"  
  coverage: '/TOTAL.*\s+(\d+%)$/'  
  artifacts:
    reports:
      junit: junit.xml  
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image: python:3.11
  services:
    - name: docker:dind
      command: ["--dns=8.8.8.8", "--dns=1.1.1.1"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      - TORCH_VERSION: ["2.6", "2.7", "2.8", "2.9"]
  before_script:
    - apt-get update && apt-get install -y docker.io
    - pip install --upgrade pip cibuildwheel
    - export TORCH_VERSION="${TORCH_VERSION}"
  script:
    - CIBW_ENVIRONMENT="TORCH_VERSION=${TORCH_VERSION}" cibuildwheel --output-dir wheelhouse --platform linux
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG  

deploy-pypi:
  stage: deploy
  image: python:3.11
  # Trusted publishing: PyPI mints a short lived token from this pipeline's OIDC identity,
  # so no long lived API token has to be stored as a CI variable.
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  before_script:
    - apt-get update && apt-get install -y jq
    - pip install twine
  script:
    - |
      resp=$(curl -sS -X POST https://pypi.org/_/oidc/mint-token \
        -d "{\"token\":\"${PYPI_ID_TOKEN}\"}")
      api_token=$(printf '%s' "${resp}" | jq -er '.token') || {
        echo "PyPI refused to mint a token. Check the trusted publisher on pypi.org matches"
        echo "this project, .gitlab-ci.yml as top-level pipeline, and the environment."
        echo "${resp}"
        exit 1
      }
      TWINE_USERNAME=__token__ TWINE_PASSWORD="${api_token}" twine upload wheelhouse/*
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build

pages:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r docs/requirements.txt
    - MORPHO_WITH_CUDA=0 pip install -e .
  script:
    - cd docs
    - make html
    - cd ..
    - mv docs/build/html public
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG

notify-release:
  stage: deploy
  image: curlimages/curl:latest
  needs:
    - job: deploy-pypi
      artifacts: false
  script:
    - |
      curl -X POST \
        -H "Content-Type: application/json" \
        -w "\nHTTP Status: %{http_code}\n" \
        -d "{
          \"attachments\": [{
            \"contentType\": \"application/vnd.microsoft.card.adaptive\",
            \"content\": {
              \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
              \"type\": \"AdaptiveCard\",
              \"version\": \"1.4\",
              \"body\": [
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"🎉 New Version of Morphocore Released!\",
                  \"weight\": \"bolder\",
                  \"size\": \"large\",
                  \"color\": \"good\"
                },
                {
                  \"type\": \"FactSet\",
                  \"facts\": [
                    {
                      \"title\": \"📦 Version:\",
                      \"value\": \"${CI_COMMIT_TAG}\"
                    }
                  ]
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"✨ What's New:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"${CI_COMMIT_MESSAGE}\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"🔗 Quick Links:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"• [📚 Documentation](https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}/)\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"• [🐍 PyPI Package](https://pypi.org/project/morphocore)\",
                  \"wrap\": true
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"⚡ Update Now:\",
                  \"weight\": \"bolder\",
                  \"spacing\": \"medium\"
                },
                {
                  \"type\": \"CodeBlock\",
                  \"codeSnippet\": \"pip install --upgrade morphocore\",
                  \"language\": \"bash\"
                },
                {
                  \"type\": \"TextBlock\",
                  \"text\": \"💡 *Don't forget to update your environment!*\",
                  \"isSubtle\": true,
                  \"spacing\": \"small\"
                }
              ]
            }
          }]
        }" \
        "${TEAMS_WEBHOOK_URL}"
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true