stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

test:
  stage: test
  image: nvidia/cuda:11.8.0-devel-ubuntu22.04
  services:
    - docker:dind
  before_script:
    - apt-get update && apt-get install -y python3 python3-pip python3-venv
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install pytest torch numpy pytest-benchmark
    - MORPHO_WITH_CUDA=0 pip install -e .  
  script:
    - pytest tests/ -v -k "cpu" --junitxml=junit.xml  
    - python -c "import morphocore; print('Import successful')"  
  coverage: '/TOTAL.*\s+(\d+%)$/'  
  artifacts:
    reports:
      junit: junit.xml  
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image: python:3.11
  services:
    - name: docker:dind
      command: ["--dns=8.8.8.8", "--dns=1.1.1.1"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      - TORCH_VERSION: ["2.6", "2.7", "2.8", "2.9"]
  before_script:
    - apt-get update && apt-get install -y docker.io
    - pip install --upgrade pip cibuildwheel
    - export TORCH_VERSION="${TORCH_VERSION}"
  script:
    - CIBW_ENVIRONMENT="TORCH_VERSION=${TORCH_VERSION}" cibuildwheel --output-dir wheelhouse --platform linux
  artifacts:
    paths:
      - wheelhouse/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG  

deploy-pypi:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install twine
  script:
    - twine upload wheelhouse/* --username __token__ --password $PYPI_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build

pages:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install -r docs/requirements.txt
  script:
    - cd docs
    - make html
    - cd ..
    - mv docs/build/html public
    - echo "Documentation deployed to https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}/"
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG